# Pubblica il sito su GitHub Pages a ogni modifica del ramo "main".
name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v6
        with:
          ref: main   # sempre l'ultima versione, anche quando si rilancia un'esecuzione vecchia

      - name: Prepara i file da pubblicare
        run: |
          mkdir -p _site
          tar --exclude="./.git" --exclude="./.github" --exclude="./_site" \
              --exclude="./README.md" --exclude="./.gitignore" \
              --exclude="./CLAUDE.md" --exclude="./sorgente" \
              -cf - . | tar -xf - -C _site
          ls -la _site

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
