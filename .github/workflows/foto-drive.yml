# TEMPORANEO: scarica le foto 2026 da Google Drive (file condivisi con link)
# e le salva nel ramo "video-originale", da cui vengono ottimizzate per il sito.
# Verrà rimosso dopo l'uso.
name: Scarica foto 2026 da Drive

on:
  push:
    branches: [main]
    paths: [".github/workflows/foto-drive.yml"]

permissions:
  contents: write

jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica le foto da Drive
        run: |
          mkdir -p /tmp/foto && cd /tmp/foto
          while read nome id; do
            curl -sSL --retry 3 -o "$nome.jpg" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
            file "$nome.jpg" | grep -qi "JPEG" || { echo "$nome non è una foto"; head -c 300 "$nome.jpg"; exit 1; }
          done <<'LISTA'
          copertina 15mjOcUw_Eur3gZwijzCOOVaDmhFyR5XG
          foto-1 1OZEGBUfczNUaE2llaWK0yEaqjPEQlNuk
          foto-1-alt 1viezmDHkYyb1zM29MkiAQYumuo7rSEVO
          foto-2 1ADpbxJjfl9v6B-HGa3AQsLt0AaU7CIc0
          foto-3 1dc1p4Lsc8hnlotU6N_dQXSa40A22XAUW
          foto-4 1n3ZVVRIodLTqPG9oqSOXB2d47tdRs38n
          LISTA
          ls -la

      - name: Salva nel ramo video-originale
        run: |
          mkdir /tmp/repo && cd /tmp/repo && git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b video-originale
          cp /tmp/foto/*.jpg .
          git add . && git commit -qm "Foto 2026 da Drive (temporaneo)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" video-originale
