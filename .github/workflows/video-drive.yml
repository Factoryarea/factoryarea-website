# TEMPORANEO: scarica il video della hero da Google Drive (file condiviso con link)
# e lo salva nel ramo "video-originale", da cui viene ottimizzato per il sito.
# Verrà rimosso dopo l'uso.
name: Scarica video da Drive

on:
  push:
    branches: [main]
    paths: [".github/workflows/video-drive.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v6

      - name: Scarica il video da Drive
        run: |
          curl -sSL --retry 3 -o /tmp/originale.mp4 \
            "https://drive.usercontent.google.com/download?id=1aLAPsUK5Mg3E4YoHhF1TB9aKpEYbpkYI&export=download&confirm=t"
          ls -la /tmp/originale.mp4
          file /tmp/originale.mp4
          file /tmp/originale.mp4 | grep -qi "ISO Media" || { echo "Il file scaricato non è un video"; head -c 400 /tmp/originale.mp4; exit 1; }

      - name: Salva nel ramo video-originale
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan video-originale
          git rm -rq --cached .
          git clean -fdq
          mv /tmp/originale.mp4 originale.mp4
          git add originale.mp4
          git commit -qm "Video originale da Drive (temporaneo)"
          git push -f origin video-originale
