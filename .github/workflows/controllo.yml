# TEMPORANEO: controllo di sicurezza (intestazioni HTTP e DNS) e pulizia del ramo
# temporaneo "video-originale". Verrà rimosso subito dopo l'uso.
name: Controllo sicurezza

on:
  push:
    branches: [main]
    paths: [".github/workflows/controllo.yml"]

permissions:
  contents: write

jobs:
  controllo:
    runs-on: ubuntu-latest
    steps:
      - name: Cancella il ramo temporaneo video-originale
        run: |
          git init -q /tmp/r && cd /tmp/r
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete video-originale 
          git ls-remote --heads "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
